<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI World Builder</title>
<style>
  :root{
    --bg:#07070b;--panel:#101018;--panel2:#151520;--text:#f3f3ff;--muted:#9292aa;
    --line:#2a2a3a;--hot:#8dfcff;--warn:#ffcf6e;--bad:#ff6e8b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
    radial-gradient(circle at 20% 10%,rgba(141,252,255,.12),transparent 30%),
    radial-gradient(circle at 80% 90%,rgba(255,207,110,.09),transparent 35%),
    var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,sans-serif;min-height:100vh}
  main{max-width:1050px;margin:0 auto;padding:32px}
  .top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:22px}
  h1{font-size:34px;line-height:1;margin:0 0 8px}
  p{color:var(--muted);margin:0}
  .badge{border:1px solid var(--line);background:rgba(16,16,24,.75);padding:9px 12px;border-radius:999px;color:var(--hot);font-size:13px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .card{background:rgba(16,16,24,.78);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.25);backdrop-filter:blur(12px)}
  textarea{width:100%;min-height:170px;resize:vertical;background:#090912;color:var(--text);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:15px;outline:none}
  textarea:focus{border-color:var(--hot);box-shadow:0 0 0 3px rgba(141,252,255,.08)}
  button{border:0;border-radius:14px;background:linear-gradient(135deg,var(--hot),#b9a7ff);color:#030307;font-weight:800;padding:13px 16px;margin-top:12px;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  pre{white-space:pre-wrap;word-break:break-word;margin:0;background:#080810;border:1px solid var(--line);border-radius:16px;padding:14px;min-height:320px;color:#dfe7ff;font-size:13px;line-height:1.45}
  .status{margin-top:12px;color:var(--muted);font-size:13px}
  .status.good{color:var(--hot)} .status.bad{color:var(--bad)}
  .preview{display:grid;gap:10px;margin-top:12px}
  .pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:#0b0b12;border-radius:999px;padding:7px 10px;color:var(--muted);font-size:13px;margin:4px 4px 0 0}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--hot);box-shadow:0 0 12px var(--hot)}
  @media(max-width:820px){.grid{grid-template-columns:1fr}.top{display:block}.badge{display:inline-block;margin-top:14px}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>AI World Builder</h1>
      <p>Prompt → structured world config → validator pressure → clean output.</p>
    </div>
    <div class="badge">v0.1 / one AI / no database yet</div>
  </div>

  <div class="grid">
    <section class="card">
      <h2>Describe a world</h2>
      <textarea id="prompt">Create a forge world where small cores search for limbs, attach them, lose energy over time, and become stronger through pressure.</textarea>
      <button id="btn" onclick="generateWorld()">Generate World</button>
      <div id="status" class="status">Ready.</div>
      <div id="preview" class="preview"></div>
    </section>

    <section class="card">
      <h2>Validated JSON</h2>
      <pre id="out">No world generated yet.</pre>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);

function renderPreview(world){
  const box = $("preview");
  if(!world || !world.name){ box.innerHTML = ""; return; }
  const ents = (world.entities||[]).map(e=>`<span class="pill"><span class="dot"></span>${e.name} / ${e.type}</span>`).join("");
  const rules = (world.rules||[]).map(r=>`<span class="pill">${r.trigger}: ${r.id}</span>`).join("");
  box.innerHTML = `
    <div><b>${world.name}</b><p>${world.description||""}</p></div>
    <div>${ents}</div>
    <div>${rules}</div>
  `;
}

async function generateWorld(){
  const btn = $("btn"), status = $("status"), out = $("out");
  btn.disabled = true;
  status.className = "status";
  status.textContent = "Generating...";
  out.textContent = "Pressure building...";
  renderPreview(null);

  try{
    const r = await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt:$("prompt").value})
    });

    const data = await r.json();

    if(!r.ok){
      status.className = "status bad";
      status.textContent = "Rejected or failed.";
      out.textContent = JSON.stringify(data,null,2);
      return;
    }

    status.className = "status good";
    status.textContent = "World accepted by validator.";
    out.textContent = JSON.stringify(data,null,2);
    renderPreview(data);
  }catch(err){
    status.className = "status bad";
    status.textContent = "Request failed.";
    out.textContent = err.message;
  }finally{
    btn.disabled = false;
  }
}
</script>
</body>
</html>
